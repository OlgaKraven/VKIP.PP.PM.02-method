groups:
  - name: stand-host
    rules:
      - alert: HighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU на {{ $labels.instance }}"
          description: "CPU > 85% более 10 минут (текущее: {{ $value }}%)"

      - alert: LowMemoryAvailable
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Мало свободной памяти на {{ $labels.instance }}"
          description: "Доступно < 15% RAM (текущее: {{ $value }}%)"

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Заполнен диск {{ $labels.mountpoint }} на {{ $labels.instance }}"
          description: "Свободно < 10%"

      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Хост {{ $labels.instance }} не отвечает"
          description: "Prometheus не может опросить node_exporter"
