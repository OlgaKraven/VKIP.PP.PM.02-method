global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    stand: lab_42

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "192.168.10.42:9100"
        labels:
          host: stand-42
          role: db-server

  - job_name: postgres_exporter
    static_configs:
      - targets:
          - "192.168.10.42:9187"
        labels:
          host: stand-42
          role: db-server
